 R.forEach(r=>{const[x,y,w,h,l,f,n,k]=r;s+=`<g class="bl" data-n="${n}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${k==='field'?18:10}" fill="${f}" stroke="#00000030" stroke-width="2"/>`;
  if(k==='field')s+=`<rect x="${x+12}" y="${y+12}" width="${w-24}" height="${h-24}" rx="8" fill="none" stroke="#fff" stroke-width="2"/><line x1="${x+w/2}" y1="${y+12}" x2="${x+w/2}" y2="${y+h-12}" stroke="#fff" stroke-width="2"/><circle cx="${x+w/2}" cy="${y+h/2}" r="16" fill="none" stroke="#fff" stroke-width="2"/>`;
  if(k==='court')s+=`<rect x="${x+14}" y="${y+14}" width="${w-28}" height="${h-28}" fill="none" stroke="#fff" stroke-width="2"/><circle cx="${x+w/2}" cy="${y+h/2}" r="14" fill="none" stroke="#fff" stroke-width="2"/>`;
  if(k==='park')for(let i=0;i<5;i++)s+=`<rect x="${x+12+i*22}" y="${y+h-34}" width="14" height="24" rx="3" fill="#ffc21a" stroke="#8a6a00"/>`;
  if(!k&&/Block/.test(l))s+=`<rect x="${x+10}" y="${y+10}" width="${w-20}" height="14" rx="3" fill="#fff8" />`;
  const lines=l.split(' ').length>2?[l.split(' ').slice(0,2).join(' '),l.split(' ').slice(2).join(' ')]:[l];
  const ty=y+h-(k==='park'?44:k==='court'||k==='field'?h/2-4:h/2)-(lines.length-1)*7;
  lines.forEach((t,i)=>s+=`<text x="${x+w/2}" y="${ty+i*15+(k||/Block/.test(l)?0:0)}" font-size="${k==='field'||k==='court'?13:14}" font-weight="700" fill="#102a43" text-anchor="middle">${t}</text>`);s+='</g>'});
 s+='<g id="rt"></g>';
 // POIs
 const ic={wc:'🚻',lab:'💻',office:'🏢',lift:'♿'};
 Object.values(N).forEach(n=>{if(ic[n.type]&&!R.some(r=>r[6]===n.id))s+=`<g class="poi" data-n="${n.id}"><circle cx="${n.x}" cy="${n.y}" r="9" fill="#fff" stroke="#0b6fb3" stroke-width="2"/><text x="${n.x}" y="${n.y+4}" font-size="11" text-anchor="middle">${ic[n.type]}</text><text x="${n.x}" y="${n.y+23}" font-size="10.5" font-weight="600" fill="#102a43" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke">${n.name.replace(/ \(.*/,'')}${n.type==='wc'?' WC':''}</text><title>${n.name}</title></g>`});
 s+=`<g id="me"></g><g stroke="none"><text x="22" y="400" font-size="12" font-weight="700" fill="#fff" stroke="#3a5166" stroke-width="3" paint-order="stroke">◀ MAIN ROAD</text><text x="1285" y="372" font-size="12" font-weight="700" fill="#fff" stroke="#3a5166" stroke-width="3" paint-order="stroke">TO CAMPUS ▶</text>
 <text x="365" y="130" font-size="13" font-weight="700" fill="#e6ffe9" stroke="#1f5a30" stroke-width="3" paint-order="stroke" text-anchor="middle">🌲 Forest</text><text x="700" y="548" font-size="13" font-weight="700" fill="#e6ffe9" stroke="#1f5a30" stroke-width="3" paint-order="stroke" text-anchor="middle">🌲 Southern Forest</text>
 <text x="715" y="200" font-size="11" font-weight="700" fill="#fff" stroke="#3a5166" stroke-width="3" paint-order="stroke" text-anchor="middle">B.TECH INSTITUTE (AITR) ▶</text></g>`;
 svg.innerHTML=s}
// ---------- App state & UI ----------
const S={from:'gate',to:null,acc:false,pick:false};
const store={get(){try{return JSON.parse(localStorage.getItem('cnsRecent')||'[]')}catch(e){return[]}},set(v){try{localStorage.setItem('cnsRecent',JSON.stringify(v))}catch(e){}}};
function mark(){svg.querySelectorAll('.on').forEach(e=>e.classList.remove('on'));if(S.to)svg.querySelectorAll(`[data-n="${S.to}"]`).forEach(e=>e.classList.add('on'));
 const f=N[S.from];$('me').innerHTML=`<circle cx="${f.x}" cy="${f.y}" r="16" fill="#2fa8f0" opacity=".3"><animate attributeName="r" values="10;22;10" dur="2s" repeatCount="indefinite"/></circle><circle cx="${f.x}" cy="${f.y}" r="8" fill="#2fa8f0" stroke="#fff" stroke-width="3"/>`}
function render(){mark();const rt=$('rt'),res=$('res');rt.innerHTML='';if(!S.to){return}
 if(S.to===S.from){res.innerHTML=`<h2>${N[S.to].name}</h2><p class="msg">You are already here. ${N[S.to].desc}</p>`;return}
 const{dist,prev}=dijkstra(S.from,S.acc),t=S.to,p=dist[t]<Infinity?pathTo(prev,S.from,t):null;
 if(!p){res.innerHTML=`<h2>${N[t].name}</h2><p class="err">No step-free route found.</p><p class="msg">Turn off “Accessible route” to see the route that uses stairs.</p>`;return}
 const pts=p.map(i=>`${N[i].x},${N[i].y}`).join(' ');
 rt.innerHTML=`<polyline class="route" points="${pts}" stroke="#7a4b00" stroke-width="12" opacity=".55"/><polyline class="route" points="${pts}" stroke="#ffc21a" stroke-width="8"/><polyline class="route flow" points="${pts}" stroke="#fff" stroke-width="3"/>`+
  p.slice(1,-1).filter(i=>N[i].type!=='j').map(i=>`<circle cx="${N[i].x}" cy="${N[i].y}" r="5" fill="#fff" stroke="#7a4b00" stroke-width="2"/>`).join('')+
  `<g transform="translate(${N[t].x} ${N[t].y})"><path d="M0 0C-14-16-14-30 0-30S14-16 0 0Z" transform="translate(0 -6)" fill="#e53935" stroke="#fff" stroke-width="2.5"/><circle cy="-30" r="4.5" fill="#fff"/></g>`;
 const named=p.slice(1,-1).filter(i=>N[i].type!=='j').map(i=>N[i].name),jn=p.slice(1,-1).filter(i=>N[i].type==='j').length,m=dist[t],min=Math.max(1,Math.round(m/(S.acc?60:75)));
 res.innerHTML=`<h2>${N[t].name}</h2><div class="msg">${N[t].desc}</div><div class="stats"><div><b>${m} m</b><span>distance</span></div><div><b>${min} min</b><span>walking</span></div><div><b>${p.length}</b><span>nodes</span></div></div>
 <div class="via"><b>From:</b> ${N[S.from].name}${S.acc?' · ♿ step-free':''}</div>${named.length?`<div class="via"><b>Passing:</b> ${named.join(' → ')}</div>`:''}<div class="via">${jn} road junction${jn===1?'':'s'} on the way</div><h3>Directions</h3><ol>${steps(p).join('')}<li>You have arrived at <b>${N[t].name}</b>.</li></ol>`}
function recents(){const r=store.get();$('rec').innerHTML=r.length?`<h3>Recent searches</h3><div class="chips">${r.map(x=>`<button type="button" data-q="${x.replace(/"/g,'&quot;')}">🕘 ${x}</button>`).join('')}</div>`:''}
function search(q){q=q.trim();if(!q)return;const r=parse(q,S.from,S.acc);if(!r){$('res').innerHTML=`<p class="err">No matching place found for “${q.replace(/</g,'&lt;')}”.</p><p class="msg">Try a place name like “library”, “AI Lab”, “CDC Garden” or “nearest washroom”.</p>`;S.to=null;$('rt').innerHTML='';mark();return}
 S.from=r.src;S.to=r.dst;$('from').value=S.from;const h=[q,...store.get().filter(x=>x!==q)].slice(0,5);store.set(h);recents();render()}
function init(){draw();
 $('from').innerHTML=POI.map(n=>`<option value="${n.id}">${n.name}</option>`).join('');$('from').value=S.from;
 const demos=['Where is the AI Lab?','DS Lab from Main Gate','Nearest washroom','CDC Garden','Stationery from Block 1','Auditorium to Basketball Court','Central Library'];
 $('demo').innerHTML=demos.map(d=>`<button type="button" data-q="${d}">${d}</button>`).join('');
 document.body.addEventListener('click',e=>{const b=e.target.closest('[data-q]');if(b){$('q').value=b.dataset.q;search(b.dataset.q)}});
 $('sf').onsubmit=e=>{e.preventDefault();search($('q').value)};
 $('from').onchange=e=>{S.from=e.target.value;render()};
 $('acc').onchange=e=>{S.acc=e.target.checked;render()};
 $('here').onclick=()=>{S.pick=!S.pick;$('here').classList.toggle('on',S.pick);$('here').textContent=S.pick?'Tap map…':"📍 I'm here"};
 svg.addEventListener('click',e=>{const g=e.target.closest('[data-n]');if(!g)return;const id=g.dataset.n;
  if(S.pick){S.from=id;$('from').value=id;S.pick=false;$('here').classList.remove('on');$('here').textContent="📍 I'm here"}else{S.to=id}render()});
 recents();mark()}
init();
</script></body></html>
